[pytest]
# 只收集 tests/ 下的单元测试。
# 关键：scripts/ 下有 test_api.py / test_ui.py / test_stream_api.py 等
# 「需要先起服务的端到端脚本」，它们与 tests/ 下同名文件会触发
# pytest 的 "import file mismatch" 收集错误（两个同名 test_api.py 且均无
# __init__.py）。限定 testpaths 后既修掉该错误，也避免误把联网脚本当单测跑。
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = scripts runs data weights logs .ruff_cache .pytest_cache .venv __pycache__
addopts = -q
