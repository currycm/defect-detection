name: tests

# 触发条件：push 到主干 / 主干上的 PR
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 串行跑：同一分支后提交的覆盖前一次还没跑完的，节省 CI 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # 注意：仓库根目录**就是**项目根（defect-detection/），因此所有 step
      # 都不需要 working-directory。此前误设 `working-directory: defect-detection`
      # 会让每条命令都去一个不存在的子目录执行，CI 必然失败。
      - name: Install dependencies
        # torch 单独装 CPU 版避免下 2GB CUDA wheel；CI 上没有 GPU 用不上
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements.txt

      - name: Lint (ruff)
        # 规则集由仓库根的 ruff.toml 固定，当前基线为 0 错误。
        # 修复方式：ruff check src scripts tests --fix
        run: |
          pip install ruff
          ruff check src scripts tests

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            .pytest_cache/
            *.log
          retention-days: 7
          if-no-files-found: ignore
